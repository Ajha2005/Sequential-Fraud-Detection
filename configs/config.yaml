# Central configuration for the Sequential Fault & Fraud Detection pipeline.
# All scripts under scripts/ read this file so parameters live in one place.

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  # If real Kaggle CSVs are not present in raw_dir, the pipeline falls back to
  # generating a synthetic dataset that mirrors the IEEE-CIS schema, so the
  # full pipeline is always runnable end to end.
  use_synthetic_if_missing: true
  synthetic:
    n_cards: 3000          # number of distinct cardholders
    min_txns_per_card: 1
    max_txns_per_card: 60
    n_days: 60              # span of TransactionDT in days
    fraud_rate: 0.035       # ~3.5% positive, matches IEEE-CIS imbalance
    fault_rate: 0.05        # fraction of *non-fraud* txns seeded as "faults" (benign anomalies)
    random_state: 42

sequence:
  id_column: card_id
  time_column: TransactionDT
  max_seq_len: 30          # fixed length after padding/truncation (justified in EDA histogram)
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  split_strategy: time      # split by transaction time, then ensure user disjointness

categorical_features:
  - ProductCD
  - card_type
  - card_category
  - merchant_category
  - device_type
  - email_domain

numeric_features:
  - log_amt
  - log_time_delta
  - amt_dev
  - amt_zscore
  - txn_hour
  - txn_dow
  - stab_ProductCD
  - stab_device_type
  - stab_email_domain

baseline:
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight_multiplier: 1.0
  logreg:
    max_iter: 1000
    class_weight: balanced

# Stronger gradient-boosted model on the richer table built in
# features/xgb_features.py (NaN-preserving C/D/V, extra raw columns, frequency
# encodings, causal per-card history). `xgboost` above stays as the original
# baseline so before/after numbers remain comparable.
xgboost_plus:
  device: auto                 # "auto" = GPU when torch sees one, else CPU; or "cpu" / "cuda"
  n_estimators: 3000           # upper bound; early stopping on validation PR-AUC picks the real number
  early_stopping_rounds: 100
  learning_rate: 0.05
  subsample: 0.8
  min_child_weight: 3
  reg_lambda: 1.0
  scale_pos_weight: 1.0        # 1.0 keeps probabilities better calibrated; or "balanced" for neg/pos ratio
  max_depth: 8                 # used when search.enabled is false
  colsample_bytree: 0.5        # used when search.enabled is false
  search:                      # small grid scored on validation PR-AUC (coarse: higher learning rate)
    enabled: true
    learning_rate: 0.1
    max_depth: [6, 9]
    colsample_bytree: [0.4, 0.7]

lstm:
  embedding_dim: 16
  hidden_size: 64
  num_layers: 2
  dropout: 0.3
  bidirectional: false
  batch_size: 64
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.00001
  loss: focal             # "focal" (Lin et al. 2017) or "bce" (pos_weight-weighted BCE)
  focal_alpha: 0.25
  focal_gamma: 2.0

transformer:
  embedding_dim: 16
  d_model: 64
  n_heads: 4
  n_layers: 2
  dim_feedforward: 128
  dropout: 0.3
  batch_size: 64
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.00001
  loss: focal             # "focal" (Lin et al. 2017) or "bce" (pos_weight-weighted BCE)
  focal_alpha: 0.25
  focal_gamma: 2.0

autoencoder:
  hidden_size: 32
  latent_size: 16
  num_layers: 1
  batch_size: 64
  epochs: 15
  learning_rate: 0.001

fault_fraud:
  fraud_prob_threshold: auto     # "auto" = the F1-maximizing threshold on the validation split; or a number such as 0.5
  anomaly_score_percentile: 90   # anomaly scores above this percentile (on normal-only val data) count as "high"

evaluation:
  n_points_for_confidence_curve: 20
  history_length_bins: [1, 3, 6, 11, 21, 1000]
  # Threshold/blend analysis (evaluation/blend.py).
  recall_targets: [0.5, 0.7]     # also report the highest-precision threshold that reaches each validation recall
  blend_models: [xgboost_plus, lstm]
  blend_weight_step: 0.05
  confusion_matrix_model: blend  # model shown in Plot 6 (falls back to lstm if the blend step has not run)
