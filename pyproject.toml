[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfraud"
version = "0.1.0"
description = "Sequential Fault & Fraud Detection - sequence models for continuous fraud probability with fault/fraud separation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
